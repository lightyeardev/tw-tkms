version: '3.7'

services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3 # this is the last build, so we can use legacy version (internal lib uses different one already)
    ports:
      - "2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      JVMFLAGS: -server -Xms25m -Xmx512m -XX:+HeapDumpOnOutOfMemoryError -XX:GCHeapFreeLimit=5 -XX:GCTimeLimit=90  -XX:SoftRefLRUPolicyMSPerMB=5 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:+ExplicitGCInvokesConcurrent
  kafka1:
    image: bitnamilegacy/kafka:3.6.0
    ports:
      - "9092:9092"
    container_name: "tw_tkms_kafka_1"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181/kafka1
      KAFKA_CFG_LISTENERS: EXTERNAL://:9092,INTERNAL://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka1:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_MESSAGE_MAX_BYTES: 10485760
      KAFKA_CFG_ZOOKEEPER_SESSION_TIMEOUT_MS: 20000
      KAFKA_CFG_UNCLEAN_LEADER_ELECTION_ENABLE: "true"
      KAFKA_CFG_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 5
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
  kafka2:
    image: bitnamilegacy/kafka:3.6.0
    ports:
      - "9093:9092"
    container_name: "tw_tkms_kafka_2"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_BROKER_ID: 2
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181/kafka2
      KAFKA_CFG_LISTENERS: EXTERNAL://:9092,INTERNAL://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9093,INTERNAL://kafka2:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_MESSAGE_MAX_BYTES: 10485760
      KAFKA_CFG_ZOOKEEPER_SESSION_TIMEOUT_MS: 20000
      KAFKA_CFG_UNCLEAN_LEADER_ELECTION_ENABLE: "true"
      KAFKA_CFG_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 5
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
  mariadb:
    image: mariadb:10.6
    ports:
      - "3306"
    environment:
      MYSQL_DATABASE: tkms
      MYSQL_ROOT_PASSWORD: example-password-change-me
    command: "mysqld --ssl=0
    --character-set-server=utf8mb4
    --collation-server=utf8mb4_unicode_ci --transaction-isolation=READ-COMMITTED --innodb_autoinc_lock_mode=2"
  postgres:
    image: postgres:12-bullseye
    ports:
      - "5432"
    environment:
      POSTGRES_PASSWORD: example-password-change-me
